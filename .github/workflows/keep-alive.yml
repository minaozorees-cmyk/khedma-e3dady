# Keep-Alive لمشروع Supabase المجاني: طلب خفيف كل ٣ أيام عشان المشروع ما يتوقفش بعد أسبوع خمول.
#
# ما فيش أي مفتاح هنا. الـping بينجح بـ HTTP 200 بس (يعني الطلب وصل لقاعدة البيانات فعلاً):
# أي 401/403 (مفتاح غلط/اتغيّر، أو الدالة مش موجودة) = فشل واضح مش نجاح مزيّف.
name: keep-alive

on:
  schedule:
    - cron: '0 0 */3 * *'   # يوم ١ و٤ و٧ ... من كل شهر ٠٠:٠٠ UTC (أقصى فاصل ٣ أيام)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (rpc/keepalive)
        env:
          SUPABASE_URL: "https://wdrphckkiqbsgqphbgez.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_xik8FQotRvkL65B9ubV_Pg_Y6z_Im8e"
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY غير مضبوطة"
            exit 1
          fi
          case "${SUPABASE_URL}" in https://*) ;; *) echo "::error::SUPABASE_URL لازم يبدأ بـ https://"; exit 1 ;; esac
          base="${SUPABASE_URL%/}"
          : > response.json
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 \
            -X POST \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${base}/rest/v1/rpc/keepalive") || code="000"
          [ -z "${code}" ] && code="000"
          echo "HTTP status: ${code}"
          if [ "${code}" = "200" ]; then
            echo "OK: Supabase رد بنجاح (الطلب وصل لقاعدة البيانات)."
            exit 0
          fi
          echo "::error::Supabase رجّع HTTP ${code} (401/403 = المفتاح غلط أو الدالة keepalive مش متعمّلة؛ 000 = مفيش اتصال)"
          head -c 500 response.json 2>/dev/null || true
          echo
          exit 1

  # ── اختياري: احذف الجوب ده كله لو الريبو private ──
  # GitHub بيوقف الـ scheduled workflows تلقائياً في الريبو الـ public لو ما حصلش فيه أي نشاط ٦٠ يوم.
  # الجوب ده بيعمل commit صغير كل تشغيل مجدول (بعد ما الـping ينجح) عشان الـ workflow ما يتوقفش.
  # لو فشل (مثلاً branch protection) ما بيبوّظش الـ run: الـping هو المهم.
  activity:
    needs: ping
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تحديث ملف النشاط
        run: |
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity.txt
          git commit -m "chore: keep-alive activity [skip ci]"
          git push
